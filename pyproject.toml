[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaw"
version = "0.2.0"
description = "Zero-Hallucination Academic Workflow — executable anti-fabrication gates for Chinese dissertations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "2456018331lby-dev" }]
keywords = ["academic", "thesis", "latex", "citation-verification", "gb-t-7714", "anti-hallucination"]
dependencies = [
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
full = [
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
zhaw = "zhaw.cli:main"

[project.urls]
Homepage = "https://github.com/2456018331lby-dev/zero-hallucination-academic-agent"

[tool.setuptools.packages.find]
include = ["zhaw*"]

[tool.ruff]
line-length = 120
target-version = "py310"
